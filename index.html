<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F4C5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TripSplit – Shared Trip Expenses</title>
<style>
:root{
  --g:#0F4C5C; --g2:#167A86; --lime:#2EC4B6; --y:#FF6B6B; --dg:#0A3540;
  --bg:#FDF6EC; --card:#FFFFFF; --tx:#1F2933; --mu:#5B6B73; --ln:#EADFCF;
  --red:#D6332F; --pos:#12867A; --sh:0 4px 18px rgba(15,76,92,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0D1B21;--card:#15282F;--tx:#ECF4F3;--mu:#9DB4B8;--ln:#23404A;--sh:0 4px 18px rgba(0,0,0,.4);--pos:#2EC4B6;--red:#FF6B66}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:140px}
/* Header */
.top{position:sticky;top:0;z-index:20;color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;
  background:linear-gradient(135deg,var(--dg) 0%,var(--g) 45%,var(--g2) 75%,var(--lime) 100%);
  border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(15,76,92,.25);overflow:hidden}
.top:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:conic-gradient(var(--y),var(--lime),var(--g2),var(--y),var(--lime),var(--g2),var(--y));opacity:.22}
.top .row{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top small{opacity:.85;font-size:12px}
.ib{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;flex:none}
.ib:active{transform:scale(.94)}
.home-btn{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 13px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff!important;text-decoration:none;font-size:13px;font-weight:700}
.home-btn:hover{background:rgba(255,255,255,.28)}
.sun{width:34px;height:34px;border-radius:50%;flex:none;background:conic-gradient(var(--y),#fff,var(--lime),var(--y),#fff,var(--lime),var(--y));box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:rgba(0,0,0,.18);padding:4px 10px;border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.live{background:var(--y);box-shadow:0 0 0 0 rgba(255,107,107,.7);animation:pulse 1.8s infinite}
.dot.off{background:#ff7b7b}.dot.conn{background:#ffd27a}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
main{padding:14px}
/* Cards */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px;border:1px solid var(--ln)}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}
.hero .big{font-size:30px;font-weight:800;letter-spacing:-.5px}
.muted{color:var(--mu);font-size:13px}
.hero .muted{color:rgba(255,255,255,.85)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;background:var(--g);color:#fff;width:100%;font-size:15px}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#fff}
.btn.ghost{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn.red{background:transparent;color:var(--red);border:1.5px solid var(--red)}
.btn.sm{width:auto;padding:8px 12px;font-size:13px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
h3{margin:4px 2px 10px;font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
/* Lists */
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
.item:last-child{border-bottom:0}
.emo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:rgba(15,76,92,.09)}
.grow{flex:1;min-width:0}
.t1{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:800;text-align:right;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--red)}
.date{font-size:12px;font-weight:700;color:var(--mu);margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.5px}
.av{width:30px;height:30px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(15,76,92,.1);color:var(--g);font-weight:700}
@media (prefers-color-scheme:dark){.pill{color:#2EC4B6}.btn.ghost{color:#2EC4B6;border-color:#2EC4B6}}
.empty{text-align:center;padding:34px 10px;color:var(--mu)}
.empty .e{font-size:46px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);margin-bottom:6px}
/* Tabs + FAB */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:15;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px)}
#tabs .in{display:flex;max-width:560px;width:100%}
#tabs button{flex:1;border:0;background:none;padding:6px 0;font-size:11px;color:var(--mu);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
#tabs button b{font-size:20px;font-weight:400}
#tabs button.on{color:var(--g)}
#tabs button.on b{transform:translateY(-2px)}
#fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(env(safe-area-inset-bottom) + 76px);z-index:16;width:62px;height:62px;border-radius:20px;border:0;
  background:linear-gradient(135deg,var(--y),#FF8E7A);color:#fff;font-size:32px;font-weight:300;box-shadow:0 8px 22px rgba(15,76,92,.35);cursor:pointer}
#fab:active{transform:scale(.93)}
.hide{display:none!important}
/* Sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;
  padding:10px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:92vh;overflow-y:auto;transform:translateY(105%);transition:transform .25s ease;-webkit-overflow-scrolling:touch}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ln);margin:2px auto 12px}
.xbtn{position:absolute;top:12px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);color:var(--mu);font-size:18px;font-weight:700;cursor:pointer;display:grid;place-items:center;z-index:2}
.xbtn:active{transform:scale(.92)}
.sheet h2{padding-right:44px}
.sheet h2{margin:0 0 14px;font-size:19px}
label.l{display:block;font-size:12px;font-weight:700;color:var(--mu);margin:12px 2px 6px;text-transform:uppercase;letter-spacing:.5px}
.f{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--ln);background:var(--bg);outline:none;font-size:16px}
.f:focus{border-color:var(--g)}
.f.amt-in{font-size:28px;font-weight:800;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:var(--bg);border-radius:20px;padding:8px 12px;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{border-color:var(--g);background:rgba(15,76,92,.12);font-weight:700}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;border:1px solid var(--ln)}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--g);box-shadow:var(--sh)}
.exrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.exrow input{width:120px;text-align:right}
.info{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(255,107,107,.14);font-size:14px;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
/* Balance bars */
.bar{height:8px;border-radius:5px;background:var(--ln);overflow:hidden;margin-top:6px;position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:5px}
.donut{width:150px;height:150px;border-radius:50%;margin:6px auto;position:relative}
.donut:after{content:"";position:absolute;inset:28px;border-radius:50%;background:var(--card)}
.donut span{position:absolute;inset:0;display:grid;place-items:center;z-index:1;font-weight:800;font-size:15px;text-align:center}
.leg{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.leg i{width:12px;height:12px;border-radius:4px;flex:none}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:linear-gradient(135deg,rgba(255,107,107,.18),rgba(46,196,182,.18));margin-bottom:8px}
.badge .e{font-size:28px}
.settle{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px dashed var(--ln)}
.settle:last-child{border-bottom:0}
/* Toast & confetti */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translate(-50%,-150%);z-index:60;background:#1F2933;color:#fff;
  padding:12px 16px;border-radius:14px;font-size:14px;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.3);transition:transform .3s;border-left:5px solid var(--y)}
#toast.on{transform:translate(-50%,0)}
#cf{position:fixed;inset:0;pointer-events:none;z-index:70}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;letter-spacing:1px}
ol.guide{padding-left:20px;line-height:1.6;font-size:14px}
pre.rules{background:var(--bg);border:1px solid var(--ln);padding:10px;border-radius:10px;font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-all}
a{color:var(--g)}
</style>
</head>
<body>
<div id="app">
  <header class="top" id="hdr"></header>
  <main id="view"></main>
</div>
<button id="fab" class="hide" data-act="addExp" aria-label="Add expense">+</button>
<nav id="tabs" class="hide"><div class="in">
  <button data-act="tab" data-arg="exp"><b>🧾</b>Expenses</button>
  <button data-act="tab" data-arg="bal"><b>⚖️</b>Balances</button>
  <button data-act="tab" data-arg="ins"><b>✨</b>Insights</button>
  <button data-act="tab" data-arg="mem"><b>👥</b>Group</button>
</div></nav>
<div class="ov" id="ov" data-act="closeSheet"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="cf"></canvas>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var LS={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v===null||v===undefined?d:v}catch(e){return d}},
        set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function r2(n){return Math.round((+n||0)*100)/100}
function uid(p){return (p||'')+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function b64e(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}

var CATS=[['food','🍽️','Food','#E07B00'],['stay','🏨','Stay','#0067B1'],['travel','🚕','Transport','#0F4C5C'],['fuel','⛽','Fuel','#795548'],
          ['fun','🎢','Activities','#C2185B'],['shop','🛍️','Shopping','#6A1B9A'],['drinks','🍹','Drinks','#00897B'],['other','📦','Other','#757575']];
var CAT={};CATS.forEach(function(c){CAT[c[0]]=c});CAT.settle=['settle','🤝','Settlement','#2EC4B6'];
var COLORS=['#0F4C5C','#E07B00','#0067B1','#C2185B','#6A1B9A','#00897B','#5D4037','#D32F2F','#3949AB','#689F38','#F57C00','#00838F'];
var CURS=['₹','$','£','€','AED ','SGD '];

var S={db:LS.get('ts_db',''),trips:LS.get('ts_trips',[]),code:null,trip:{},tab:'exp',es:null,loaded:false,
       known:{},sync:'',q:'',form:null,celebrated:{},me:null};

/* ---------- data access ---------- */
function T(){return S.trip||{}}
function meta(){return T().meta||{}}
function cur(){return meta().currency||'₹'}
function members(){return meta().members||{}}
function memberList(){var m=members();return Object.keys(m).map(function(k){var o=m[k];o.id=k;return o}).sort(function(a,b){return (a.ts||0)-(b.ts||0)})}
function mname(id){var m=members()[id];return m?m.name:'Someone'}
function mcolor(id){var m=members()[id];return m?m.color:'#999'}
function expList(){var e=T().expenses||{};return Object.keys(e).map(function(k){var o=e[k];o.id=k;return o})
  .sort(function(a,b){return (b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0)})}
function curTrip(){for(var i=0;i<S.trips.length;i++)if(S.trips[i].code===S.code)return S.trips[i];return null}
function fmt(n){n=r2(n);var a=Math.abs(n);return (n<0?'-':'')+cur()+a.toLocaleString('en-IN',{minimumFractionDigits:a%1?2:0,maximumFractionDigits:2})}
function av(id,size){var n=mname(id);var s=size?'width:'+size+'px;height:'+size+'px;':'';
  return '<span class="av" style="'+s+'background:'+mcolor(id)+'">'+esc(n.trim().slice(0,1).toUpperCase())+'</span>'}

function balances(){var b={};memberList().forEach(function(m){b[m.id]=0});
  expList().forEach(function(e){b[e.paidBy]=(b[e.paidBy]||0)+(+e.amount||0);
    var sp=e.split||{};for(var k in sp)b[k]=(b[k]||0)-(+sp[k]||0)});
  for(var k in b)b[k]=r2(b[k]);return b}
function settlements(){var b=balances(),cr=[],db=[];
  for(var id in b){var c=Math.round(b[id]*100);if(c>0)cr.push([id,c]);else if(c<0)db.push([id,-c])}
  cr.sort(function(a,b){return b[1]-a[1]});db.sort(function(a,b){return b[1]-a[1]});
  var out=[],i=0,j=0;while(i<db.length&&j<cr.length){var x=Math.min(db[i][1],cr[j][1]);
    out.push({from:db[i][0],to:cr[j][0],amt:x/100});db[i][1]-=x;cr[j][1]-=x;if(!db[i][1])i++;if(!cr[j][1])j++}
  return out}
function equalSplit(amt,ids){var c=Math.round(amt*100),n=ids.length,base=Math.floor(c/n),rem=c-base*n,s={};
  ids.forEach(function(id,i){s[id]=(base+(i<rem?1:0))/100});return s}

/* ---------- storage / sync ---------- */
function applyAt(path,data){var seg=path.split('/').filter(Boolean);
  if(!seg.length){S.trip=data&&typeof data==='object'?data:{};return}
  var o=S.trip;for(var i=0;i<seg.length-1;i++){if(!o[seg[i]]||typeof o[seg[i]]!=='object')o[seg[i]]={};o=o[seg[i]]}
  var last=seg[seg.length-1];if(data===null)delete o[last];else o[last]=data}
function write(path,val){var t=curTrip();applyAt(path,val);
  if(t&&t.db){fetch(t.db+'/trips/'+encodeURIComponent(t.code)+'/'+path+'.json',{method:val===null?'DELETE':'PUT',
      body:val===null?undefined:JSON.stringify(val)})
    .then(function(r){if(!r.ok)throw 0}).catch(function(){toast('⚠️ Could not sync. Check internet / database rules.')})}
  else LS.set('ts_local_'+S.code,S.trip);
  S.known[path.split('/')[1]]=1;afterData(true)}
function disconnect(){if(S.es){S.es.close();S.es=null}}
function setSync(s){S.sync=s;var el=$('#syncTxt');if(el)renderHeader()}
function connect(){disconnect();var t=curTrip();S.loaded=false;S.known={};S.trip={};
  S.me=LS.get('ts_me_'+S.code,null);
  if(t.db){setSync('conn');
    try{var es=new EventSource(t.db+'/trips/'+encodeURIComponent(t.code)+'.json');S.es=es;
      es.addEventListener('put',function(ev){var m=JSON.parse(ev.data);applyAt(m.path,m.data);afterData()});
      es.addEventListener('patch',function(ev){var m=JSON.parse(ev.data);var p=m.path==='/'?'':m.path;for(var k in m.data)applyAt(p+'/'+k,m.data[k]);afterData()});
      es.addEventListener('cancel',function(){setSync('off');toast('⛔ Database refused access – check rules.')});
      es.onopen=function(){setSync('live')};
      es.onerror=function(){setSync(navigator.onLine?'conn':'off')};
    }catch(e){setSync('off')}
  }else{S.trip=LS.get('ts_local_'+S.code,{});setSync('local');afterData()}
}
window.addEventListener('storage',function(e){if(S.code&&e.key==='ts_local_'+S.code){S.trip=LS.get(e.key,{});afterData()}});

function afterData(local){
  var ex=T().expenses||{};
  if(S.loaded&&!local){for(var id in ex){if(!S.known[id]){var e=ex[id];
      if(e.by!==S.me)toast((e.type==='settle'?'🤝 ':'🔔 ')+esc(mname(e.by))+' added '+esc(e.type==='settle'?'a settlement':e.desc)+' · '+fmt(e.amount));}}}
  S.known={};for(var k in ex)S.known[k]=1;
  if(!S.loaded&&(S.sync!=='conn'||Object.keys(T()).length||true))S.loaded=true;
  var t=curTrip();if(t&&meta().name&&t.name!==meta().name){t.name=meta().name;LS.set('ts_trips',S.trips)}
  render();
  if(S.code&&meta().name&&(!S.me||!members()[S.me])&&!$('#sheet').classList.contains('on'))whoSheet();
}

/* ---------- UI: header ---------- */
function renderHeader(){var h=$('#hdr');
  if(!S.code){h.innerHTML='<a class="home-btn" href="https://piyushjn-collab.github.io" title="Back to home page">🏠 Home</a><div class="row"><div class="sun"></div><div style="flex:1"><h1>TripSplit</h1><small>Travel together. Split fairly. Stay friends.</small></div>'+
    '<button class="ib" data-act="settings" aria-label="Settings">⚙️</button></div>';return}
  var st={live:['live','Live'],conn:['conn','Connecting…'],off:['off','Offline'],local:['','This device only']}[S.sync]||['','…'];
  h.innerHTML='<div class="row"><button class="ib" data-act="home" aria-label="Back">←</button><div style="flex:1;min-width:0"><h1>'+esc(meta().name||'Loading…')+'</h1>'+
   '<span class="sync" id="syncTxt"><span class="dot '+st[0]+'"></span>'+st[1]+' · <span class="code">'+esc(S.code)+'</span></span></div>'+
   '<button class="ib" data-act="invite" aria-label="Invite">📤</button></div>'}

/* ---------- UI: render ---------- */
function render(){renderHeader();var v=$('#view');
  var inTrip=!!S.code&&!!meta().name;
  $('#fab').classList.toggle('hide',!inTrip||S.tab==='mem');$('#tabs').classList.toggle('hide',!inTrip);
  [].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.arg===S.tab)});
  if(!S.code){v.innerHTML=homeView();return}
  if(!meta().name){v.innerHTML=S.sync==='conn'&&!S.loaded?'<div class="empty"><div class="e">⏳</div>Loading trip…</div>':
    '<div class="empty"><div class="e">🧭</div><b>Trip not found yet</b><p>Check the trip code and that everyone uses the same database.</p><button class="btn ghost" data-act="home">Back to trips</button></div>';return}
  v.innerHTML=({exp:expView,bal:balView,ins:insView,mem:memView}[S.tab]||expView)();
  if(S.tab==='exp')renderList();
}

function homeView(){var h='';
  h+='<div class="card hero"><div style="font-size:22px;font-weight:800">Where did the money go? 🧳</div><p class="muted" style="margin:6px 0 14px">Create a trip, invite your gang, and everyone adds expenses live from their own phone.</p>'+
     '<div class="grid2"><button class="btn y" data-act="newTrip">＋ New trip</button><button class="btn" style="background:rgba(255,255,255,.2)" data-act="joinTrip">🔗 Join trip</button></div></div>';
  h+=S.db?'<div class="card row"><span style="font-size:24px">🟢</span><div class="grow"><b>Live sharing is ON</b><div class="muted">Trips you create sync in real time with everyone.</div></div><button class="btn sm ghost" data-act="settings">Edit</button></div>':

 settings:settingsSheet, newTrip:newTripSheet, joinTrip:function(){joinSheet()}, closeSheet:closeSheet,
 testDb:function(){var u=$('#dbUrl').value.trim().replace(/\/+$/,'');if(!/^https:\/\//.test(u)){toast('URL must start with https://');return}
   fetch(u+'/trips/_ping.json',{method:'PUT',body:JSON.stringify({t:Date.now()})}).then(function(r){toast(r.ok?'✅ Connected! Database works.':'⛔ Reached but refused – check Rules.')}).catch(function(){toast('⛔ Could not reach that URL')})},
 saveDb:function(){var u=$('#dbUrl').value.trim().replace(/\/+$/,'');if(u&&!/^https:\/\//.test(u)){toast('URL must start with https://');return}
   S.db=u;LS.set('ts_db',u);closeSheet();render();toast(u?'🟢 Live sharing enabled':'Live sharing turned off')},
 createTrip:function(){var n=$('#ntName').value.trim(),me=$('#ntMe').value.trim();if(!n||!me){toast('Trip name and your name please');return}
   var pre=(n.replace(/[^A-Za-z]/g,'').toUpperCase()+'TRIP').slice(0,4),ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code=pre+'-';for(var i=0;i<4;i++)code+=ch[Math.floor(Math.random()*ch.length)];
   var mem={},names=[me].concat($('#ntOthers').value.split(',').map(function(s){return s.trim()}).filter(Boolean)),seen={},myId=null;
   names.forEach(function(nm,i){if(seen[nm.toLowerCase()])return;seen[nm.toLowerCase()]=1;var id=uid('m')+i;if(i===0)myId=id;mem[id]={name:nm,color:COLORS[i%COLORS.length],ts:Date.now()+i}});
   S.trips.push({code:code,name:n,db:S.db});LS.set('ts_trips',S.trips);LS.set('ts_me_'+code,myId);
   closeSheet();S.code=code;connect();S.me=myId;write('meta',{name:n,currency:$('#ntCur').value,members:mem,created:Date.now()});
   setTimeout(function(){toast('🎉 Trip created! Tap 📤 to invite friends.')},300)},
 doJoin:function(){join($('#jCode').value)},
 setMe:setMe,
 addMe:function(){var id=addMember($('#meNew').value);if(id)setMe(id)},
 whoAmI:whoSheet,
 invite:function(){var t=curTrip(),ic=inviteCode(),link=/^https?:/.test(location.protocol)?location.origin+location.pathname+'?join='+ic:'';
   var msg='🧳 Join our trip "'+meta().name+'" on TripSplit!\n'+(link?'Tap: '+link+'\n\nOr open':'Open')+' TripSplit → Join trip → paste this code:\n'+ic;
   openSheet('<h2>📤 Invite friends</h2>'+(t.db?'':'<div class="info">⚠️ This trip is on this device only, so others won’t see updates. Enable live sharing first.</div>')+
     '<label class="l">Invite code</label><textarea class="f code" rows="3" readonly style="font-size:13px">'+esc(ic)+'</textarea>'+
     (link?'<label class="l">Direct link</label><input class="f" readonly value="'+esc(link)+'">':'')+
     '<div class="grid2" style="margin-top:14px"><button class="btn ghost" data-act="copyInv">📋 Copy</button><button class="btn" data-act="shareInv">💬 Share</button></div>');
   S._inv=msg},
 copyInv:function(){copy(S._inv)}, shareInv:function(){shareText(S._inv)},
 addExp:function(){if(!memberList().length){toast('Add members first');return}expenseSheet()},
 editExp:function(id){expenseSheet(id)},
 cat:function(c){S.form.cat=c;renderCats()},
 mode:function(m){S.form.mode=m;if(m==='exact'){var a=r2(parseFloat(S.form.amount));var ids=Object.keys(S.form.sel).filter(function(k){return S.form.sel[k]});
     if(a>0&&ids.length&&!Object.keys(S.form.exact).length){var sp=equalSplit(a,ids);for(var k in sp)S.form.exact[k]=String(sp[k])}}renderSplit()},
 tog:function(id){S.form.sel[id]=!S.form.sel[id];renderSplit()},
 selAll:function(){var all=memberList().every(function(m){return S.form.sel[m.id]});memberList().forEach(function(m){S.form.sel[m.id]=!all});renderSplit()},
 fillRest:function(){var f=S.form,a=r2(parseFloat(f.amount)),empty=memberList().filter(function(m){return !(parseFloat(f.exact[m.id])>0)});var s=0;for(var k in f.exact)s+=parseFloat(f.exact[k])||0;
   var rem=r2(a-s);if(rem<=0||!empty.length)return;var sp=equalSplit(rem,empty.map(function(m){return m.id}));for(var k2 in sp)f.exact[k2]=String(sp[k2]);renderSplit()},
 saveExp:function(){var f=S.form,a=r2(parseFloat(f.amount));if(!(a>0)){toast('Enter a valid amount');return}
   var split={};if(f.mode==='equal'){var ids=memberList().map(function(m){return m.id}).filter(function(k){return f.sel[k]});if(!ids.length){toast('Pick at least one person');return}split=equalSplit(a,ids)}
   else{var s=0;memberList().forEach(function(m){var v=r2(parseFloat(f.exact[m.id]));if(v>0){split[m.id]=v;s+=v}});if(Math.abs(r2(s)-a)>0.01){toast('Exact amounts must add up to '+fmt(a));return}}
   var old=f.id?(T().expenses||{})[f.id]:null,id=f.id||uid('e');
   var obj={type:'expense',desc:(f.desc||'').trim()||CAT[f.cat][2],amount:a,paidBy:f.paidBy,split:split,cat:f.cat,date:f.date||today(),mode:f.mode,
     by:old?old.by:S.me,ts:old?old.ts:Date.now(),ub:S.me,uts:Date.now()};
   closeSheet();write('expenses/'+id,obj);toast(old?'✏️ Updated':'✅ Added '+esc(obj.desc)+' · '+fmt(a));if(navigator.vibrate)navigator.vibrate(15)},
 delExp:function(id){if(!confirm('Delete this for everyone?'))return;closeSheet();write('expenses/'+id,null);toast('🗑️ Deleted')},
 markPaid:function(i){var s=settlements()[+i];if(!s)return;if(!confirm(mname(s.from)+' paid '+mname(s.to)+' '+fmt(s.amt)+'?'))return;
   var sp={};sp[s.to]=s.amt;write('expenses/'+uid('s'),{type:'settle',desc:'Settlement',amount:s.amt,paidBy:s.from,split:sp,cat:'settle',date:today(),by:S.me,ts:Date.now()});toast('🤝 Settlement recorded')},
 shareSummary:function(){var b=balances(),tot=0,st=settlements();expList().forEach(function(e){if(e.type!=='settle')tot+=+e.amount||0});
   var t='🧳 *'+meta().name+'* – TripSplit summary\nTotal spend: '+fmt(tot)+' ('+memberList().length+' people)\n\n💰 *Balances*\n';
   memberList().forEach(function(m){var v=b[m.id]||0;t+='• '+m.name+': '+(Math.abs(v)<0.01?'settled ✅':v>0?'gets back '+fmt(v):'owes '+fmt(-v))+'\n'});
   if(st.length){t+='\n🤝 *To settle*\n';st.forEach(function(s){t+='• '+mname(s.from)+' → '+mname(s.to)+': '+fmt(s.amt)+'\n'})}else t+='\n🎉 All settled!';
   shareText(t)},
 addMem:function(){var el=$('#newMem');if(addMember(el.value)){el.value='';toast('👥 Member added')}},
 rename:function(){var n=$('#tName').value.trim();if(n){write('meta/name',n);toast('Saved')}},
 setCur:function(c){write('meta/currency',c)},
 csv:function(){var rows=[['Date','Description','Category','Amount','Paid by'].concat(memberList().map(function(m){return m.name}))];
   expList().slice().reverse().forEach(function(e){rows.push([e.date,e.type==='settle'?'Settlement':e.desc,CAT[e.cat]?CAT[e.cat][2]:'',e.amount,mname(e.paidBy)].concat(memberList().map(function(m){return (e.split||{})[m.id]||0})))});
   var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
   var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(meta().name||'trip').replace(/\W+/g,'_')+'.csv';document.body.appendChild(a);a.click();a.remove()},
 leave:function(){if(!confirm('Remove this trip from your list? (Data stays for others.)'))return;S.trips=S.trips.filter(function(t){return t.code!==S.code});LS.set('ts_trips',S.trips);A.home()},
 toCloud:function(){if(!S.db)return;var t=curTrip(),data=S.trip;fetch(S.db+'/trips/'+encodeURIComponent(t.code)+'.json',{method:'PUT',body:JSON.stringify(data)})
   .then(function(r){if(!r.ok)throw 0;t.db=S.db;LS.set('ts_trips',S.trips);connect();toast('🌐 Trip is now shared live!')}).catch(function(){toast('⛔ Upload failed')})}
};
document.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;var a=A[el.dataset.act];if(!a)return;
  if(el.tagName==='A')e.preventDefault();a(el.dataset.arg,el,e)});
function onInput(e){var t=e.target;
  if(t.dataset.f&&S.form){S.form[t.dataset.f]=t.value;if(t.dataset.f==='amount')updateSplitInfo()}
  if(t.dataset.ex&&S.form){S.form.exact[t.dataset.ex]=t.value;updateSplitInfo()}
  if(t.id==='search'){S.q=t.value;renderList()}}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var id=e.target.id;
  if(id==='newMem')A.addMem();else if(id==='meNew')A.addMe();else if(id==='tName')A.rename()});

/* ---------- toast & confetti ---------- */
var tt;function toast(m){var t=$('#toast');t.innerHTML=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}
function confetti(){var c=$('#cf'),x=c.getContext('2d'),W=c.width=innerWidth,H=c.height=innerHeight,cols=['#0F4C5C','#2EC4B6','#FF6B6B','#FDF6EC','#ffffff'],p=[];
  for(var i=0;i<140;i++)p.push({x:W/2,y:H/3,vx:(Math.random()-.5)*14,vy:Math.random()*-12-3,s:Math.random()*7+4,c:cols[i%5],r:Math.random()*6});
  var n=0;(function f(){x.clearRect(0,0,W,H);p.forEach(function(q){q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.r+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.r);x.fillStyle=q.c;x.fillRect(-q.s/2,-q.s/4,q.s,q.s/2);x.restore()});
    if(++n<130)requestAnimationFrame(f);else x.clearRect(0,0,W,H)})();toast('🎉 Everyone is settled up!')}

/* ---------- boot ---------- */
window.addEventListener('online',function(){if(S.code)connect()});
var jp=new URLSearchParams(location.search).get('join');
render();
if(jp){history.replaceState(null,'',location.pathname);join(jp)}
})();
</script>
</body>
